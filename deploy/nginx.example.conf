# Admin panel and API on one origin, so the refresh cookie works with
# COOKIE_SAMESITE=strict. Set TRUST_PROXY=true and COOKIE_SECURE=true in the API's .env.

server {
    listen 443 ssl http2;
    server_name admin.example.com;

    # ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;

    client_max_body_size 6m;   # keep in step with UPLOAD_MAX_IMAGE_MB

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # UPLOAD_STORAGE_ROOT
    location /uploads/ {
        alias /var/www/nearmart/uploads/;
        add_header X-Content-Type-Options nosniff;
        expires 30d;
    }

    # admin/dist from `npm run build`
    location / {
        root /var/www/nearmart/admin;
        try_files $uri /index.html;
    }
}
