# One origin serves the admin panel, the API and uploaded media. The admin's
# refresh cookie then works with COOKIE_SAMESITE=strict.
# API .env for this setup: TRUST_PROXY=true, COOKIE_SECURE=true, UPLOAD_BASE_URL=/uploads
#
# The customer app talks to the same host (https://admin.example.com/api/v1) or a
# second server_name pointing at the same upstream; mobile apps send no Origin,
# so CORS doesn't apply to them.

upstream nearmart_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name admin.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.example.com;

    # certbot --nginx fills these in.
    # ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types application/json application/javascript text/css application/yaml text/csv image/svg+xml;

    # Keep in step with UPLOAD_MAX_IMAGE_MB (5) plus multipart overhead.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://nearmart_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    # Razorpay webhooks: exact path, no buffering surprises, small bodies.
    location = /api/v1/payments/webhook/razorpay {
        client_max_body_size 1m;
        proxy_pass http://nearmart_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Banner clips (UPLOAD_MAX_VIDEO_MB 25 plus multipart overhead).
    location = /api/v1/uploads/video {
        client_max_body_size 26m;
        proxy_pass http://nearmart_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }

    # UPLOAD_STORAGE_ROOT. Files are re-encoded images and checked MP4 / WebM clips, served as static content only.
    location /uploads/ {
        alias /var/www/nearmart/uploads/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        expires 30d;
        access_log off;
        location ~* \.(?!webp$|gif$|png$|jpe?g$|mp4$|webm$)[^.]+$ { return 404; }
    }

    # seller/dist: the seller dashboard, a separate app under /seller/ (Vite base '/seller/').
    location = /seller { return 301 /seller/; }
    location ^~ /seller/assets/ {
        root /var/www/nearmart;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /seller/ {
        root /var/www/nearmart;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /seller/index.html;
    }

    # admin/dist from `npm run build`. Hashed assets cache forever; index.html never.
    root /var/www/nearmart/admin;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
